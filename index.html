<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15131e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Spine">
<title>The Spine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15131e; --surface:#1e1b29; --raised:#262234; --raised2:#2d2940;
    --border:#332e46; --border-soft:#2a2638;
    --ink:#ece6dc; --muted:#9a8fb0; --faint:#6f6786;
    --gold:#f2c879; --gold-dim:rgba(242,200,121,.16);
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,monospace;
    --rail:90px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
    overscroll-behavior-y:none;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .app{max-width:560px;margin:0 auto;min-height:100vh}
  ::selection{background:var(--gold-dim)}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:16px}
  textarea{resize:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

  .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(var(--bg) 72%,rgba(21,19,30,0));
    display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 18px 12px}
  .brand{font-family:var(--serif);font-weight:600;font-size:25px;letter-spacing:.3px;line-height:1}
  .brand small{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--faint);display:block;margin-bottom:3px}
  .iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted);
    background:var(--surface);border:1px solid var(--border-soft)}
  .iconbtn:active{background:var(--raised)}
  .iconbtn svg{width:19px;height:19px}

  .view{padding:0 18px 30px;animation:fade .26s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:24px 0 10px}

  /* focus bar */
  .focusbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0 12px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
    border-radius:999px;padding:7px 12px;font-size:13px;color:var(--muted)}
  .pill.on{color:var(--bg);background:var(--gold);border-color:var(--gold);font-weight:600}
  .pill select{background:none;border:none;color:inherit;font-weight:600;font-size:13px;appearance:none}
  .pill select option{color:#000}
  .pill .dot{width:9px;height:9px;border-radius:50%}

  /* book + milestone */
  .book-head{display:flex;align-items:center;gap:12px;margin:24px 0 12px}
  .book-head .bk{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--gold)}
  .book-head .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}
  .book-head .addms{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border-soft);
    border-radius:999px;padding:5px 11px;display:inline-flex;align-items:center;gap:5px}
  .book-head .addms svg{width:13px;height:13px}

  .ms{margin-bottom:9px}
  .ms-head{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--border-soft);
    border-radius:13px;padding:12px 13px}
  .ms-head:active{border-color:var(--border)}
  .ms-chev{color:var(--faint);display:grid;place-items:center;transition:transform .2s}
  .ms-chev svg{width:16px;height:16px}
  .ms.open .ms-chev{transform:rotate(90deg)}
  .ms-flag{color:var(--gold);display:grid;place-items:center}
  .ms-flag svg{width:15px;height:15px}
  .ms-title{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.15;flex:1;min-width:0}
  .ms-count{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .ms-tools{display:flex;gap:3px;margin-left:2px}
  .ms-tools button{width:26px;height:26px;border-radius:8px;color:var(--faint);display:grid;place-items:center}
  .ms-tools button:active{background:var(--raised2)}
  .ms-tools svg{width:13px;height:13px}
  .ms-body{padding:10px 0 4px 8px;border-left:1px solid var(--border-soft);margin:8px 0 4px 16px}
  .ms-add{font-size:12.5px;color:var(--muted);padding:7px 4px;display:inline-flex;align-items:center;gap:6px}
  .ms-add svg{width:14px;height:14px}

  /* compact scene row */
  .scene{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface);
    border:1px solid var(--border-soft);border-radius:11px;padding:10px 12px;margin-bottom:8px;transition:border-color .15s}
  .scene:active{border-color:var(--border)}
  .scene .sc-main{flex:1;min-width:0}
  .gist-c{font-family:var(--serif);font-size:16.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gist-c.empty{color:var(--faint);font-style:italic}
  .sc-sub{display:flex;align-items:center;gap:6px;margin-top:5px}
  .who{display:flex}
  .who .av{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:600;
    color:#1a1626;margin-left:-5px;border:1.5px solid var(--surface)}
  .who .av:first-child{margin-left:0}
  .loc-chip{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:500;background:var(--raised);color:var(--muted)}
  .scene .sc-grip{display:grid;place-items:center;width:24px;color:var(--faint);touch-action:none;cursor:grab;flex:none;margin:-4px 0}
  .scene .sc-grip svg{width:15px;height:15px}
  .sc-main{flex:1;min-width:0}
  .slip-lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:11px 0 7px}
  .ms-head.drop,.book-head.drop{outline:2px dashed var(--gold);outline-offset:3px;border-radius:12px}
  .sc-tools{display:flex;flex-direction:column;gap:2px}
  .sc-tools button{width:24px;height:22px;border-radius:6px;color:var(--faint);display:grid;place-items:center}
  .sc-tools button:active{background:var(--raised)}
  .sc-tools svg{width:12px;height:12px}

  /* arc rail */
  .spine{position:relative}
  .spine.has-rail{padding-right:var(--rail)}
  .rail{position:absolute;top:0;right:0;width:var(--rail);height:100%;pointer-events:none}
  .rail svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .rail-head{position:sticky;top:62px;z-index:5;display:flex;justify-content:space-between;
    font-family:var(--serif);font-style:italic;font-size:12px;color:var(--muted);padding:0 2px 6px}

  .cmp-head{display:flex;flex-direction:column;gap:8px;padding:6px 0 14px}
  .cmp-pick{display:flex;align-items:center;gap:8px}
  .cmp-pick .tag{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--gold);width:18px;text-align:center}
  .cmp-pick .pill select{max-width:120px;text-overflow:ellipsis}
  .cmp{position:relative;padding:0 27%}
  .cmp-lane{position:absolute;top:0;bottom:0;width:26%}
  .cmp-lane.left{left:0}.cmp-lane.right{right:0}
  .cmp-lane svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .cmp-mid{min-width:0}
  .cmp-scene{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:8px 9px;margin-bottom:9px}
  .cmp-scene.shared{border-color:var(--gold);background:rgba(242,200,121,.07)}
  .cmp-scene .g{font-family:var(--serif);font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmp-scene .g.empty{color:var(--faint);font-style:italic}
  .cmp-scene .pres{display:flex;align-items:center;gap:5px;margin-top:5px;min-height:8px}
  .cmp-scene .pdot{width:8px;height:8px;border-radius:50%}
  .shared-lbl{font-size:9px;font-family:var(--mono);color:var(--gold);letter-spacing:.04em}
  .bond-set{background:var(--raised);border:1px solid var(--border-soft);border-radius:13px;padding:12px 13px;margin-top:10px}
  .bond-names{font-family:var(--serif);font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .bond-names .dot{width:11px;height:11px;border-radius:50%}
  .bond-banner{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 10px;
    font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.05em;text-transform:lowercase}
  .bond-banner:before,.bond-banner:after{content:'';height:1px;flex:1;max-width:60px;background:linear-gradient(90deg,transparent,var(--border))}
  .bond-banner:after{background:linear-gradient(90deg,var(--border),transparent)}
  .bond-banner .dot{width:8px;height:8px;border-radius:50%}

  .ftiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ftile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
    background:var(--surface);border:1px solid var(--border-soft);border-radius:16px;color:var(--muted);padding:8px}
  .ftile:active{background:var(--raised)}
  .ftile.on{border-color:rgba(242,200,121,.5);background:rgba(242,200,121,.06);color:var(--ink)}
  .ftile .fic svg{width:24px;height:24px}
  .ftile .flab{font-family:var(--serif);font-size:15px;font-weight:600;text-align:center;line-height:1.05}
  .ftile .fcount{font-family:var(--mono);font-size:10px;color:var(--gold)}
  .ftile .fcount.empty{color:var(--faint)}
  .facet-h{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:16px}
  .facet-h svg{width:22px;height:22px;color:var(--gold)}
  .stats{background:var(--surface);border:1px solid var(--border-soft);border-radius:13px;padding:2px 14px;margin-bottom:10px}
  .stat{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--border-soft)}
  .stat:first-child{border-top:none}
  .stat .sl{color:var(--muted);font-size:13px;flex:none}
  .stat .sv{font-weight:600;font-size:13px;text-align:right;font-family:var(--serif)}
  .heat-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px 10px}
  .heat{display:inline-block;min-width:100%}
  .heat-row{display:flex;align-items:center}
  .heat-name{width:96px;flex:none;position:sticky;left:0;background:var(--bg);z-index:2;font-family:var(--serif);
    font-size:14px;display:flex;align-items:center;gap:6px;padding:2px 8px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .heat-name .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .heat-cell{width:15px;height:22px;flex:none;border-radius:3px;background:var(--surface);margin:2px 1px}
  .heat-cell.sep{margin-left:6px;box-shadow:inset 2px 0 0 var(--border)}
  .heat-head{margin-bottom:1px}
  .heat-tick{height:6px;background:var(--border-soft)}
  .tdots{display:inline-flex;align-items:center;gap:3px;margin-left:2px}
  .tdot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .bal-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .bal-name{width:100px;flex:none;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bal-track{flex:1;height:10px;background:var(--surface);border:1px solid var(--border-soft);border-radius:6px;overflow:hidden}
  .bal-fill{height:100%;border-radius:6px;min-width:3px}
  .bal-n{font-family:var(--mono);font-size:11px;color:var(--faint);width:22px;text-align:right}
  .rel-av{display:flex;flex:none}
  .av2{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#1a1626}
  .rel-av .av2:last-child{margin-left:-9px;border:2px solid var(--bg)}
  .rel-ev2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;background:var(--surface);border:1px solid var(--border-soft);border-radius:11px;padding:10px 12px;margin-bottom:9px}
  .rel-when{font-family:var(--serif);font-size:15px}
  .rel-stage{font-family:var(--mono);font-size:11px;color:var(--gold);flex:none}
  .seg-row{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:4px;margin-bottom:16px}
  .seg{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--muted);background:none;border:none;font-family:var(--sans);cursor:pointer}
  .seg.on{background:var(--gold);color:#1a1626;font-weight:600}
  .rule-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:13px;padding:13px 14px;margin-bottom:10px}
  .rule-top{display:flex;align-items:flex-start;gap:10px}
  .rule-txt{flex:1;font-family:var(--serif);font-size:17px;line-height:1.3}
  .tl-ev{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:11px 13px;margin-bottom:9px}
  .tl-when{font-family:var(--mono);font-size:11px;color:var(--gold);flex:none;width:74px;padding-top:2px}
  .tl-what{flex:1;font-family:var(--serif);font-size:16px;line-height:1.32}
  .pick-list{max-height:52vh;overflow:auto;margin:2px -4px 0}
  .pick-list .sheet-row{cursor:pointer}
  .wounds{border-left:2px solid var(--border);margin-left:7px;padding-left:18px;margin-bottom:6px}
  .wound{position:relative;background:var(--surface);border:1px solid var(--border-soft);border-radius:13px;padding:13px 14px 15px;margin-bottom:12px}
  .wound:before{content:'';position:absolute;left:-25px;top:17px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
  .wound-title{font-family:var(--serif)!important;font-size:19px!important;font-weight:600;border:none!important;background:none!important;padding:2px 0!important;margin-bottom:2px}
  .wound label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:11px 0 5px}
  .wound .input{padding:9px 11px}
  .wound-del{position:absolute;top:11px;right:11px;color:var(--faint);z-index:2}
  .wound-del svg{width:15px;height:15px}
  .prompt{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--muted);background:var(--raised);
    border-left:2px solid var(--gold);border-radius:8px;padding:11px 14px;margin-bottom:18px;line-height:1.42}

  .conn-row{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border-soft);border-radius:11px;padding:9px 11px;margin-bottom:8px}
  .conn-lbl{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted)}
  .conn-to{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-left:auto;color:var(--ink)}
  .conn-to .dot{width:9px;height:9px;border-radius:50%}
  .conn-del{color:var(--faint)}.conn-del svg{width:14px;height:14px}
  .web-focus{display:flex;align-items:center;gap:12px;justify-content:center;width:100%;padding:16px;
    background:rgba(242,200,121,.07);border:1px solid rgba(242,200,121,.4);border-radius:16px;margin-bottom:4px}
  .web-focus .swatch{display:grid;place-items:center;border-radius:13px;color:#1a1626;font-family:var(--serif);font-weight:600;font-size:18px}
  .web-name{font-family:var(--serif);font-size:24px;font-weight:600}
  .web-branches{padding-left:18px;border-left:2px solid var(--border);margin:6px 0 0 24px}
  .branch{display:flex;align-items:center;gap:9px;margin:15px 0;position:relative;flex-wrap:wrap}
  .branch:before{content:'';position:absolute;left:-18px;top:18px;width:15px;height:1px;background:var(--border)}
  .branch-lbl{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:.03em;width:100%}
  .branch-node{display:inline-flex;align-items:center;gap:6px;font-family:var(--serif);font-size:18px;font-weight:600;background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:7px 12px}
  .branch-node .dot{width:9px;height:9px;border-radius:50%}

  /* capture */
  .capture-box{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-top:18px}
  .capture-box textarea{width:100%;background:none;border:none;color:var(--ink);font-family:var(--serif);
    font-size:23px;line-height:1.35;min-height:92px;outline:none}
  .capture-box textarea::placeholder{color:var(--faint);font-style:italic}
  .capture-actions{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .hint{font-size:12px;color:var(--faint)}
  .slip{background:var(--surface);border:1px solid var(--border-soft);border-left:3px solid var(--gold);
    border-radius:12px;padding:13px 14px;margin-bottom:10px}
  .slip .txt{font-family:var(--serif);font-size:18px;line-height:1.3}
  .slip .when{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:6px}
  .slip-actions{display:flex;gap:8px;margin-top:11px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:10px 15px;
    font-size:14px;font-weight:600;background:var(--raised);color:var(--ink);border:1px solid var(--border)}
  .btn:active{background:var(--raised2)}
  .btn.gold{background:var(--gold);color:#1a1626;border-color:var(--gold)}
  .btn.ghost{background:none;color:var(--muted)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
  .btn.danger{color:#e89898}
  .btn svg{width:16px;height:16px}

  .row{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border-soft);
    border-radius:14px;padding:13px 15px;margin-bottom:9px}
  .row:active{border-color:var(--border)}
  .row.sub{margin-left:22px;padding:10px 13px;background:var(--raised)}
  .row .swatch{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--serif);
    font-size:17px;font-weight:600;color:#1a1626;flex:none}
  .row.sub .swatch{width:28px;height:28px}
  .row .rt{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.1}
  .row.sub .rt{font-size:17px}
  .row .rs{font-size:12px;color:var(--muted);margin-top:2px}
  .row .chev{margin-left:auto;color:var(--faint)}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin-bottom:8px}
  .input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;color:var(--ink);outline:none}
  .code{background:#0d0b14;border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--gold);white-space:pre-wrap;overflow-x:auto}
  .input:focus{border-color:var(--gold)}
  .gist-input{font-family:var(--serif);font-size:22px;line-height:1.3;min-height:78px;width:100%;background:var(--surface);
    border:1px solid var(--border);border-radius:12px;padding:13px;color:var(--ink);outline:none}
  .gist-input:focus{border-color:var(--gold)}

  .chip-pick{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--surface);
    border:1px solid var(--border);font-size:14px;color:var(--muted)}
  .chip:active{background:var(--raised)}
  .chip .dot{width:11px;height:11px;border-radius:50%}
  .chip.on{border-color:transparent;color:#1a1626;font-weight:600;background:var(--gold)}
  .chip.add{border-style:dashed;color:var(--faint)}
  .chip.sub{font-size:13px;padding:6px 11px;opacity:.92}

  .trait-set{background:var(--raised);border:1px solid var(--border-soft);border-radius:13px;padding:13px 14px;margin-top:10px}

<script>
"use strict";
window.onerror=function(msg,src,line,col){try{var d=document.getElementById('errbar');if(!d){d=document.createElement('div');d.id='errbar';d.setAttribute('style','position:fixed;left:8px;right:8px;bottom:74px;z-index:99999;background:#3a1f28;color:#ffd9d9;font:11px/1.4 ui-monospace,monospace;padding:9px 11px;border:1px solid #7a3b4a;border-radius:10px;max-height:38vh;overflow:auto;white-space:pre-wrap');d.onclick=function(){d.remove();};document.body.appendChild(d);}d.textContent='⚠ '+msg+(line?(' @'+line+':'+col):'')+'  (tap to dismiss)';}catch(_){}return false;};
/* THE SPINE — vertical map of a story. Data in localStorage; DB module isolated for future cloud sync. */
const PAL=['#e0a3b4','#9ec79f','#8fb4d9','#c4a3e0','#e6b87a','#7fc4c0','#e09a78','#aab0e8','#cfa0c8','#9ec0a0'];
const TRAIT_COLORS=['#f2c879','#9ec79f','#8fb4d9','#e0a3b4','#c4a3e0','#7fc4c0'];
const BOND_STAGES=['strangers','wary','enemies','rivals','allies','friendly','close','lovers','estranged'];
const CORE_DIMS=[
  {key:'emp',low:'Empathetic',high:'Objective',info:'Do they lead with feeling and connection, or with cool analysis?'},
  {key:'open',low:'Open',high:'Discerning',info:'Do they trust readily, or weigh people carefully before letting them in?'},
  {key:'bold',low:'Bold',high:'Deliberate',info:'Do they leap, or look long before they leap?'},
  {key:'direct',low:'Direct',high:'Diplomatic',info:'Do they say it plainly, or shape it for the listener?'},
  {key:'sacr',low:'Self-Sacrificing',high:'Self-Protective',info:'Do they put others first, or guard themselves first?'},
  {key:'expl',low:'Exploratory',high:'Grounded',info:'Are they pulled toward the new, or rooted in the known?'},
  {key:'adapt',low:'Adaptive',high:'Structured',info:'Do they flow with change, or build and keep order?'},
  {key:'forg',low:'Forgiving',high:'Just',info:'Do they lean toward mercy, or toward fairness and consequence?'}
];
const PURPOSE_TAGS=['introduce','conflict','romance','reveal','foreshadow','decision','setback','recovery','worldbuilding','twist'];
const DLG_TONES=['playful','cold','defensive','angry','vulnerable','tender','sarcastic','fearful','detached'];
const DLG_PURPOSES=['plot','character','relationship','world','theme','conflict','humor'];
const DLG_GROUP='__group__';
const REL_DIMS=[
  {key:'trust',label:'Trust',low:'guarded',high:'trusting'},
  {key:'respect',label:'Respect',low:'dismissive',high:'admiring'},
  {key:'affection',label:'Affection',low:'cold',high:'devoted'},
  {key:'honesty',label:'Honesty',low:'secretive',high:'open'},
  {key:'power',label:'Power balance',low:'__A__',high:'__B__'}
];
const uid=()=>Math.random().toString(36).slice(2,9);
const KEY='the-spine-v2';

const DB={ load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}},
  save(s){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}} };

/* ---- Optional cloud backup (Firebase). Fully opt-in; app works 100% offline without it. ---- */
const FBKEY='the-spine-fb';
let FB={ready:false,user:null,lastT:null};
let cloudOpen=false;
const Cloud={
  cfg(){try{return JSON.parse(localStorage.getItem(FBKEY));}catch(e){return null;}},
  setCfg(c){localStorage.setItem(FBKEY,JSON.stringify(c));},
  clear(){localStorage.removeItem(FBKEY);}
};
function loadFBsdk(cb,err){
  if(window.firebase&&window.firebase.database){cb();return;}
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const files=['firebase-app-compat.js','firebase-auth-compat.js','firebase-database-compat.js'];
  let i=0;(function nx(){if(i>=files.length){cb();return;}const s=document.createElement('script');s.src=base+files[i++];s.onload=nx;s.onerror=function(){err&&err({message:'Could not reach Firebase — are you online?'});};document.head.appendChild(s);})();
}
function fbInit(cfg,cb,err){
  loadFBsdk(function(){
    try{
      if(!firebase.apps||!firebase.apps.length)firebase.initializeApp(cfg);
      FB.ready=true;
      firebase.auth().onAuthStateChanged(function(u){FB.user=u;if(u&&FB.lastT==null)cloudFetchMeta();if(cloudOpen)cloudSheet();});
      cb&&cb();
    }catch(e){err?err(e):0;}
  },err);
}
function openCloud(){cloudOpen=true;const c=Cloud.cfg();
  if(c&&!FB.ready){cloudSheet('Connecting…');fbInit(c,function(){cloudSheet();},function(e){cloudSheet((e&&e.message)||'Could not connect.',true);});}
  else cloudSheet();
}
function cloudSheet(msg,isErr){
  cloudOpen=true;const c=Cloud.cfg();
  const note=msg?`<div class="hint" style="margin:-2px 0 12px;color:${isErr?'#ff9a9a':'var(--gold)'}">${esc(msg)}</div>`:'';
  let body;
  if(!c){
    body=`<p class="hint" style="margin-bottom:10px">Cloud backup is optional — The Spine works fully offline without it. To turn it on, paste your Firebase web config (Firebase console → Project settings → Your apps → Web → SDK config). Enable <b>Realtime Database</b> first, and set its Rules to require a login:</p>
      <pre class="code">{ "rules": { ".read": "auth != null", ".write": "auth != null" } }</pre>
      <textarea class="input" id="fbCfg" style="height:120px;font-family:var(--mono);font-size:12px;line-height:1.4" placeholder="const firebaseConfig = { apiKey: '...', databaseURL: '...', ... }"></textarea>
      <div style="display:flex;gap:9px;margin-top:12px"><button class="btn ghost" data-act="askCancel" style="flex:1">Cancel</button><button class="btn gold" data-act="cloudConnect" style="flex:1">Connect</button></div>`;
  } else if(!FB.user){
    body=`<p class="hint" style="margin-bottom:12px">Sign in to back up and restore. One account is all you need — the same login on another device pulls your story down.</p>
      <input class="input" id="fbEmail" type="email" value="${esc(FB._email||'')}" placeholder="email" autocapitalize="off" autocomplete="username" style="margin-bottom:9px">
      <input class="input" id="fbPw" type="password" placeholder="password (6+ characters)" autocomplete="current-password">
      <div style="display:flex;gap:9px;margin-top:12px"><button class="btn" data-act="cloudSignup" style="flex:1">Create account</button><button class="btn gold" data-act="cloudSignin" style="flex:1">Sign in</button></div>
      <button class="btn ghost sm" data-act="cloudDisconnect" style="width:100%;margin-top:12px">Disconnect this Firebase</button>`;
  } else {
    const last=FB.lastT?('Last backup '+fmt(FB.lastT)):'No cloud backup yet';
    body=`<div class="sheet-row" style="color:var(--faint)">${ICON.info}<div><div>${esc(FB.user.email||'signed in')}</div><div class="s">${last}</div></div></div>
      <div class="sheet-row" data-act="cloudBackup">${ICON.up2}<div><div>Back up now</div><div class="s">Copy this device's story to the cloud</div></div></div>
      <div class="sheet-row" data-act="cloudRestore">${ICON.down2}<div><div>Restore to this device</div><div class="s">Replace what's here with the cloud copy</div></div></div>
      <button class="btn ghost sm" data-act="cloudSignout" style="width:100%;margin-top:12px">Sign out</button>`;
  }
  openSheet(`<h3>Cloud backup</h3>${note}${body}`);
}
function cloudFetchMeta(){try{firebase.database().ref('spine/'+FB.user.uid+'/t').get().then(function(s){const v=s.val();if(v){FB.lastT=v;if(cloudOpen)cloudSheet();}}).catch(function(){});}catch(e){}}
function cloudConnect(){
  const t=document.getElementById('fbCfg');const text=t?t.value:'';
  const grab=function(k){const m=text.match(new RegExp(k+"\\s*[:=]\\s*[\"']([^\"']+)[\"']"));return m?m[1]:'';};
  const cfg={apiKey:grab('apiKey'),authDomain:grab('authDomain'),databaseURL:grab('databaseURL'),projectId:grab('projectId'),storageBucket:grab('storageBucket'),messagingSenderId:grab('messagingSenderId'),appId:grab('appId')};
  if(!cfg.apiKey){cloudSheet("Couldn't find an apiKey in that — paste the whole config block.",true);return;}
  if(!cfg.databaseURL){cloudSheet("No databaseURL found. Enable Realtime Database, then copy the config again.",true);return;}
  Cloud.setCfg(cfg);FB.ready=false;cloudSheet('Connecting…');
  fbInit(cfg,function(){cloudSheet();},function(e){cloudSheet((e&&e.message)||'Could not connect.',true);});
}
function authDo(method){
  const e=document.getElementById('fbEmail'),p=document.getElementById('fbPw');
  const email=e?e.value.trim():'',pw=p?p.value:'';
  if(!email||!pw){cloudSheet('Enter an email and a password.',true);return;}
  FB._email=email;
  cloudSheet('Working…');
  firebase.auth()[method](email,pw).then(function(){FB.lastT=null;cloudSheet();}).catch(function(err){cloudSheet(prettyAuth(err),true);});
}
function cloudSignin(){authDo('signInWithEmailAndPassword');}
function cloudSignup(){authDo('createUserWithEmailAndPassword');}
function prettyAuth(err){const c=(err&&err.code)||'';
  if(c.indexOf('wrong-password')>=0||c.indexOf('invalid-credential')>=0)return 'Wrong email or password.';
  if(c.indexOf('email-already-in-use')>=0)return 'That email already has an account — sign in instead.';
  if(c.indexOf('user-not-found')>=0)return 'No account yet — tap Create account.';
  if(c.indexOf('weak-password')>=0)return 'Password needs at least 6 characters.';
  if(c.indexOf('invalid-email')>=0)return "That email doesn't look right.";
  if(c.indexOf('network')>=0)return 'Network problem — are you online?';
  return (err&&err.message)||'Something went wrong.';}
function cloudBackup(){if(!FB.user)return;cloudSheet('Backing up…');
  firebase.database().ref('spine/'+FB.user.uid).set({data:JSON.stringify(S),t:Date.now()})
    .then(function(){FB.lastT=Date.now();cloudSheet('Backed up just now.');})
    .catch(function(err){cloudSheet((err&&err.message)||'Backup failed.',true);});}
function cloudRestore(){if(!FB.user)return;
  openSheet(`<h3>Restore from cloud?</h3><p class="hint" style="margin-bottom:14px">This replaces everything on this device with your cloud backup. The local copy here will be overwritten — export it first if you're unsure.</p>
   <div style="display:flex;gap:9px"><button class="btn ghost" data-act="openCloud" style="flex:1">Back</button><button class="btn gold" data-act="cloudRestoreDo" style="flex:1">Replace & restore</button></div>`);}
function cloudRestoreDo(){if(!FB.user)return;cloudSheet('Restoring…');
  firebase.database().ref('spine/'+FB.user.uid).get().then(function(snap){const v=snap.val();
    if(!v||!v.data){cloudSheet('No cloud backup found yet — back up first.',true);return;}
    try{const d=JSON.parse(v.data);S=migrate(d);S.ui.view='spine';DB.save(S);cloudOpen=false;closeSheet();render();}
    catch(e){cloudSheet('That backup could not be read.',true);}
  }).catch(function(err){cloudSheet((err&&err.message)||'Restore failed.',true);});}
function cloudSignout(){try{firebase.auth().signOut();}catch(e){}FB.user=null;FB.lastT=null;cloudSheet();}
function cloudDisconnect(){Cloud.clear();FB.ready=false;FB.user=null;FB.lastT=null;try{if(window.firebase&&firebase.apps&&firebase.apps.length)firebase.app().delete();}catch(e){}cloudSheet();}

const CHAR_CATS=[
  {key:'role',label:'Role',type:'multi'},

function migrate(s){
  const d=seed();
  s.milestones=s.milestones||[]; s.palettes=s.palettes||d.palettes;
  for(const k of ['character','location']){ s.palettes[k]=Object.assign({},d.palettes[k],s.palettes[k]||{}); }
  s.scenes=(s.scenes||[]).map(sc=>Object.assign({milestone:null,arc:{},characters:[],location:null,body:''},sc));
  s.characters=(s.characters||[]).map(c=>Object.assign({attrs:{},traits:[],struggles:[],core:{},wounds:[]},c));
  s.characters.forEach(c=>{c.core=c.core||{};c.wounds=c.wounds||[];
    if(c.struggles&&c.struggles.length&&!c.wounds.length){c.wounds=c.struggles.map(st=>({id:st.id||uid(),title:st.text||'',event:'',belief:'',behavior:'',healing:''}));}
    c.wounds=c.wounds.map(w=>Object.assign({id:uid(),title:'',societalLie:'',event:'',belief:'',coreFear:'',behavior:'',healing:'',triggers:[]},w));
    c.wounds.forEach(w=>{w.triggers=(w.triggers||[]).map(tr=>Object.assign({id:uid(),trigger:'',response:''},tr));});});
  s.locations=(s.locations||[]).map(l=>Object.assign({parent:null,attrs:{},facets:{}},l));
  s.slips=(s.slips||[]).map(sl=>Object.assign({book:'b1',characters:[]},sl));
  s.connections=s.connections||[];
  s.bonds=s.bonds||{};
  s.threads=(s.threads||[]).map((t,i)=>Object.assign({desc:'',color:PAL[i%PAL.length],books:[],chars:[]},t));
  s.themes=(s.themes||[]).map((t,i)=>Object.assign({desc:'',color:PAL[i%PAL.length],books:[],chars:[]},t));
  s.objects=(s.objects||[]).map(o=>Object.assign({color:PAL[0],note:'',owner:null,places:[],chars:[],scenes:[]},o));
  s.orgs=(s.orgs||[]).map(o=>Object.assign({color:PAL[0],goal:'',leader:null,members:[],hq:null,allies:[],enemies:[],scenes:[]},o));
  s.rules=(s.rules||[]).map(r=>Object.assign({scenes:[]},r));
  s.ideas=(s.ideas||[]).map(n=>Object.assign({id:uid(),title:'',body:'',t:Date.now()},n));
  s.dialogue=(s.dialogue||[]).map(dl=>Object.assign({recipients:[],tone:[],purpose:[],subtext:'',woundLink:null,triggerLink:null,pattern:null,notes:''},dl));
  s.scenes.forEach(sc=>{sc.links=sc.links||[];});
  s.locations.forEach(l=>{l.timeline=l.timeline||[];});
  s.locations.forEach(l=>{l.facets=l.facets||{};
    Object.keys(l.facets).forEach(fk=>{const fo=l.facets[fk];
      if(Array.isArray(fo)){l.facets[fk]={notes:fo.join('\n')};return;}
      if(fo&&typeof fo==='object'){Object.keys(fo).forEach(lk=>{if(Array.isArray(fo[lk]))fo[lk]=fo[lk].join('\n');});}
    });});
  const coerce=(at,cats)=>{at=at||{};cats.forEach(c=>{const v=at[c.key];if(c.type==='multi'){if(typeof v==='string')at[c.key]=[v];}else{if(Array.isArray(v))at[c.key]=v[0]||null;}});return at;};
  s.characters.forEach(c=>{c.attrs=coerce(c.attrs,CHAR_CATS);});
  s.locations.forEach(l=>{l.attrs=coerce(l.attrs,LOC_CATS);});
  if(!s.ui) s.ui=d.ui; s.ui.open=s.ui.open||{};
  s.ui.editScene=null; s.ui.openCast=null; s.ui.openLoc=null; s.ui.facet=null; s.ui.filter=null;
  return s;
}
/* ---- PROJECTS LIBRARY (1.1b) ----
   A typed layer above the single story blob. Each project has its own
   independent data. Your existing story is wrapped as "Series 1" without
   rewriting it, and is written to a NEW key — the legacy the-spine-v2 blob
   is never touched, so it survives as an extra fallback. ---- */
const LIBKEY='the-spine-lib-v3';
function newProject(type,name){return {id:uid(),type:type||'story',name:name||'Untitled',createdAt:Date.now(),data:(type==='poetry'?seedPoetry():seed())};}
function isLib(o){return !!(o&&typeof o==='object'&&Array.isArray(o.projects));}
function looksStory(o){return !!(o&&typeof o==='object'&&!Array.isArray(o.projects)&&(o.books||o.scenes||o.characters||o.locations||o.ui));}
function migrateLib(raw){
  let lib;
  if(isLib(raw)) lib=raw;
  else if(looksStory(raw)) lib={version:3,projects:[{id:uid(),type:'story',name:'Series 1',createdAt:Date.now(),data:raw}],activeId:null};
  else lib={version:3,projects:[],activeId:null};
  lib.version=3; lib.projects=lib.projects||[];
  lib.projects=lib.projects.map(function(p){
    p=p||{}; p.id=p.id||uid(); p.type=p.type||'story'; p.name=p.name||'Untitled'; p.createdAt=p.createdAt||Date.now();
    if(p.type==='story') p.data=migrate(p.data||seed()); else if(p.type==='poetry') p.data=migratePoetry(p.data); else p.data=p.data||{};
    return p;
  });
  if(!lib.projects.length) lib.projects.push(newProject('story','Series 1'));
  if(lib.activeId && !lib.projects.some(function(p){return p.id===lib.activeId;})) lib.activeId=null;
  return lib;
}
function loadLib(){
  let raw=null;
  try{raw=JSON.parse(localStorage.getItem(LIBKEY));}catch(e){}
  if(!isLib(raw)){ const legacy=DB.load(); if(looksStory(legacy)) raw=legacy; } /* one-time wrap of pre-projects data */
  return migrateLib(raw);
}
let LIB=loadLib();

function viewSpine(){
  if(S.scenes.length===0 && S.milestones.length===0){
    return `<div class="view"><div class="empty"><div class="mk">An empty page.</div>
      <p>Build the bones first if you like — lay out the milestones a book moves toward — or just catch a moment and sort it later.</p>
      <button class="btn gold" data-act="goCapture">${ICON.feather} Catch a moment</button>
      <button class="btn" data-act="addMs" data-book="b1">${ICON.flag} Lay a milestone</button></div></div>`;
  }
  const fc=S.ui.focusChar?charById(S.ui.focusChar):null;
  const hasRail=!!(fc&&fc.traits.length);
  const filt=S.ui.filter;
  const fmatch=s=>!filt||(filt.kind==='thread'?(s.threads||[]).includes(filt.id):(s.themes||[]).includes(filt.id));
  const forceOpen=hasRail||!!filt;
  let h=`<div class="view">${focusBar()}${filterBar()}<div class="spine ${hasRail?'has-rail':''}" id="spine">`;
  if(hasRail){const tr=fc.traits.find(t=>t.id===S.ui.focusTrait)||fc.traits[0];
    h+=`<div class="rail-head"><span>${esc(tr.poleLow||'—')}</span><span>${esc(tr.poleHigh||'—')}</span></div>`;}
  S.books.forEach(b=>{
    const ms=milestonesOf(b.id), loose=looseOf(b.id).filter(fmatch);
    const hasAny=loose.length||ms.some(m=>scenesOfMs(m.id).some(fmatch));
    if(filt&&!hasAny)return;
    h+=`<div class="book-head" data-book="${b.id}"><span class="bk">${esc(b.name)}</span><span class="ln"></span>
      <button class="addms" data-act="addMs" data-book="${b.id}">${ICON.plus} milestone</button></div>`;
    if(loose.length){ h+=`<div class="ms open"><div class="ms-body" style="margin-left:6px;border:none;padding-left:0">
      <div class="ms-add" style="color:var(--faint);font-style:italic">Loose — not under a milestone yet</div>`;
      loose.forEach((s,i)=>h+=sceneRow(s,i,loose.length)); h+=`</div></div>`; }
    ms.forEach((m,mi)=>{
      const full=scenesOfMs(m.id),list=filt?full.filter(fmatch):full;
      if(filt&&!list.length)return;
      const open=forceOpen||!!S.ui.open[m.id];
      h+=`<div class="ms ${open?'open':''}">
        <div class="ms-head" data-act="toggleMs" data-id="${m.id}">
          <span class="ms-chev">${ICON.chevR}</span><span class="ms-flag">${ICON.flag}</span>
          <span class="ms-title" data-act="renameMs" data-id="${m.id}">${esc(m.name)}</span>
          <span class="ms-count">${filt?list.length+'/'+full.length:full.length}</span>
          <span class="ms-tools">
            <button data-act="msUp" data-id="${m.id}" ${mi===0?'disabled style=opacity:.3':''}>${ICON.up}</button>
            <button data-act="msDown" data-id="${m.id}" ${mi===ms.length-1?'disabled style=opacity:.3':''}>${ICON.down}</button>
            <button data-act="delMs" data-id="${m.id}">${ICON.trash}</button>
          </span></div>`;
      if(open){ h+=`<div class="ms-body">`;
        list.forEach((s,i)=>h+=sceneRow(s,i,list.length));
        h+=`<button class="ms-add" data-act="addScene" data-ms="${m.id}" data-book="${b.id}">${ICON.plus} scene</button></div>`;
      }
      h+=`</div>`;
    });
  });
  h+=hasRail?`<div class="rail" id="rail"><svg id="railsvg" preserveAspectRatio="none"></svg></div>`:'';
  h+=`</div></div>`;return h;
}

function sceneRow(s,i,n){
  const who=(s.characters||[]).map(id=>{const c=charById(id);return c?`<span class="av" style="background:${c.color}">${esc(initials(c.name))}</span>`:'';}).join('');
  const lc=s.location&&locById(s.location);
  const tdots=(s.threads||[]).map(id=>{const t=S.threads.find(x=>x.id===id);return t?`<span class="tdot" style="background:${t.color}"></span>`:'';}).join('');
  const thdots=(s.themes||[]).map(id=>{const t=S.themes.find(x=>x.id===id);return t?`<span class="tdot" style="background:transparent;border:1.5px solid ${t.color||'var(--faint)'}"></span>`:'';}).join('');
  const bw=((s.body||'').trim().match(/\S+/g)||[]).length;

/* ---------------- COMPARE TWO ARCS ---------------- */
function cmpPicker(side){
  const cur=S.ui['cmp'+side], ch=cur&&charById(cur), curT=S.ui['cmp'+side+'t'];
  const charOpts=S.characters.map(c=>`<option value="${c.id}" ${cur===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  let traitSel='';
  if(ch&&ch.traits.length){const t=ch.traits.find(x=>x.id===curT)||ch.traits[0];
    traitSel=`<span class="pill on"><span class="dot" style="background:${t.color}"></span><select data-act="cmpTrait" data-side="${side}">${ch.traits.map(x=>`<option value="${x.id}" ${t.id===x.id?'selected':''}>${esc(x.name||'arc')}</option>`).join('')}</select></span>`;}
  return `<div class="cmp-pick"><span class="tag">${side}</span>
    <span class="pill ${cur?'on':''}" ${cur?`style="background:${ch.color};color:#1a1626;border-color:transparent"`:''}><select data-act="cmpChar" data-side="${side}"><option value="">choose…</option>${charOpts}</select></span>${traitSel}</div>`;
}
function cmpView(){
  const A=S.ui.cmpA&&charById(S.ui.cmpA), B=S.ui.cmpB&&charById(S.ui.cmpB);
  const At=A&&(A.traits.find(t=>t.id===S.ui.cmpAt)||A.traits[0]);
  const Bt=B&&(B.traits.find(t=>t.id===S.ui.cmpBt)||B.traits[0]);
  let h=`<div class="view"><div class="cmp-head">${cmpPicker('A')}${cmpPicker('B')}</div>`;
  if(!(A&&At&&B&&Bt)){
    h+=`<div class="empty"><div class="mk">Pick two.</div><p>Choose a character and one of their arcs on each side, and watch them move down the same scenes.</p></div></div>`;return h;}
  const flat=flatScenes();
  if(!flat.length){h+=`<div class="empty"><p>No scenes to compare across yet.</p></div></div>`;return h;}
  h+=`<div class="cmp" id="cmp"><div class="cmp-lane left"><svg id="cmpsvgA"></svg></div><div class="cmp-lane right"><svg id="cmpsvgB"></svg></div><div class="cmp-mid">`;
  const bt=bondTrack(A.id,B.id);let prevStage=null;
  flat.forEach((s,idx)=>{
    const stage=bt[idx].stage,changed=stage!=null&&stage!==prevStage;prevStage=stage;
    if(changed)h+=`<div class="bond-banner"><span class="dot" style="background:${A.color}"></span><span class="dot" style="background:${B.color}"></span>${esc(stage)}</div>`;
    const inA=(s.characters||[]).includes(A.id),inB=(s.characters||[]).includes(B.id),shared=inA&&inB;
    h+=`<div class="cmp-scene ${shared?'shared':''}" data-id="${s.id}" data-act="openScene">
      <div class="g ${s.gist?'':'empty'}">${s.gist?esc(s.gist):'untitled'}</div>
      <div class="pres">${inA?`<span class="pdot" style="background:${A.color}"></span>`:''}${inB?`<span class="pdot" style="background:${B.color}"></span>`:''}${shared?'<span class="shared-lbl">they cross here</span>':''}</div></div>`;});
  h+=`</div></div></div>`;return h;
}
function cmpDraw(svg,tr,track,cy,H){
  if(!svg)return;const w=svg.clientWidth||90,PAD=15;
  svg.setAttribute('viewBox',`0 0 ${w} ${H}`);svg.style.height=H+'px';
  const xf=v=>PAD+((v-1)/9)*(w-2*PAD);
  let d='',dots='',labels='';
  track.forEach(p=>{const y=cy(p.id);if(y==null)return;const x=xf(p.val);
    d+=(d?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
    if(p.set){dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" fill="${tr.color}" stroke="#15131e" stroke-width="2"/>`;
      labels+=`<text x="${(x+(x>w/2?-7:7)).toFixed(1)}" y="${(y+3).toFixed(1)}" font-size="9" font-family="ui-monospace,monospace" fill="${tr.color}" text-anchor="${x>w/2?'end':'start'}">${p.val}</text>`;}});
  svg.innerHTML=`<text x="${PAD}" y="11" font-size="10" font-style="italic" font-family="Cormorant Garamond,serif" fill="#9a8fb0">${esc(tr.poleLow||'')}</text>
    <text x="${w-PAD}" y="11" font-size="10" font-style="italic" font-family="Cormorant Garamond,serif" fill="#9a8fb0" text-anchor="end">${esc(tr.poleHigh||'')}</text>
    <line x1="${xf(1)}" y1="16" x2="${xf(1)}" y2="${H}" stroke="#2a2638"/><line x1="${xf(10)}" y1="16" x2="${xf(10)}" y2="${H}" stroke="#2a2638"/>
    <path d="${d}" fill="none" stroke="${tr.color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}`;
}
function drawCompare(){
  const A=S.ui.cmpA&&charById(S.ui.cmpA),B=S.ui.cmpB&&charById(S.ui.cmpB);if(!A||!B)return;
  const At=A.traits.find(t=>t.id===S.ui.cmpAt)||A.traits[0],Bt=B.traits.find(t=>t.id===S.ui.cmpBt)||B.traits[0];if(!At||!Bt)return;
  const cmp=document.getElementById('cmp');if(!cmp)return;
  const rect=cmp.getBoundingClientRect(),H=cmp.scrollHeight,rows=[...cmp.querySelectorAll('.cmp-scene')];
  const cy=id=>{const el=rows.find(r=>r.dataset.id===id);if(!el)return null;const r=el.getBoundingClientRect();return r.top-rect.top+r.height/2;};
  cmpDraw(document.getElementById('cmpsvgA'),At,traitTrack(A.id,At.id),cy,H);
  cmpDraw(document.getElementById('cmpsvgB'),Bt,traitTrack(B.id,Bt.id),cy,H);
}

function sceneEditor(){
  const s=S.scenes.find(x=>x.id===S.ui.editScene);if(!s){go('spine');return;}

    +`<button class="chip add" data-act="newMsHere" data-book="${s.book}">+ new</button>`;

      style="${present.includes(c.id)?`background:${c.color};color:#1a1626`:''}"><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')
    +`<button class="chip add" data-act="quickChar">+ new</button>`;

      const prev=prevTraitVal(id,t.id,s.id);const shown=v==null?prev:v;
      const delta=v==null?`<span class="delta none">unchanged</span>`:(v===prev?`<span class="delta none">holds ${v}</span>`:`<span class="delta">${prev} → ${v}</span>`);

        <div class="trait-line"><input type="range" min="1" max="10" value="${shown}" data-act="setTrait" data-cid="${id}" data-tid="${t.id}">

        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">${delta}

  const inLinks=flatScenes().filter(x=>x.id!==s.id&&(x.links||[]).some(lk=>lk.to===s.id)).map(x=>{const lk=x.links.find(l=>l.to===s.id);const verb=lk.kind==='payoff'?'set up in ←':'follows from ←';

const entOf=(k,id)=>k==='character'?charById(id):locById(id);
const entName=(k,id)=>{const e=entOf(k,id);return e?e.name:'(removed)';};
const entColor=(k,id)=>{const e=entOf(k,id);return e?e.color:'#666';};
function connsOf(k,id){return S.connections.filter(c=>(c.a.kind===k&&c.a.id===id)||(c.b.kind===k&&c.b.id===id))
  .map(c=>{const mine=c.a.kind===k&&c.a.id===id;return {id:c.id,label:c.label,other:mine?c.b:c.a};});}
function connPresets(a,b){
  if(a==='character'&&b==='character')return['ally','friend','enemy','rival','family','mentor','lover','enemies to lovers','betrayed by'];
  if(a==='location'&&b==='location')return['road to','borders','part of','at war with','allied with','trades with'];
  if(a==='character')return['from','rules','exiled from','hides in','protects','seeks'];
  return['home of','ruled by','guarded by','haunted by','contested by'];
}
function connSection(k,id){

  return `<div class="eyebrow">Connections</div>

    <div style="display:flex;gap:8px"><button class="btn sm" data-act="startConnect" data-k="${k}" data-id="${id}">${ICON.branch} Connect</button>

}

/* ---------------- AUTO INSIGHTS (computed from scenes) ---------------- */
function charPresence(cid){
  const flat=flatScenes(),idxs=[];
  flat.forEach((s,i)=>{if((s.characters||[]).includes(cid))idxs.push(i);});
  if(!idxs.length)return {count:0};
  const scenes=idxs.map(i=>flat[i]);
  const books=[...new Set(scenes.map(s=>s.book))];
  const ms=[...new Set(scenes.map(s=>s.milestone).filter(Boolean))];
  const locs=[...new Set(scenes.map(s=>s.location).filter(Boolean))];
  const comp={};scenes.forEach(s=>(s.characters||[]).forEach(o=>{if(o!==cid)comp[o]=(comp[o]||0)+1;}));
  let topComp=null,topN=0;Object.keys(comp).forEach(o=>{if(comp[o]>topN){topN=comp[o];topComp=o;}});
  let gap=0;for(let k=1;k<idxs.length;k++)gap=Math.max(gap,idxs[k]-idxs[k-1]-1);

/* ---------------- RELATIONSHIPS (first-class) ---------------- */
function relData(a,b){const k=pairKey(a,b);const r=S.bonds[k]=S.bonds[k]||{points:{}};
  r.points=r.points||{};r.dims=r.dims||{};r.memories=r.memories||[];r.secrets=r.secrets||{};if(typeof r.influence!=='string')r.influence='';return r;}
function allRelPairs(){
  const set={};
  Object.keys(S.bonds).forEach(k=>{const p=k.split('|');if(p.length===2&&charById(p[0])&&charById(p[1]))set[k]=[p[0],p[1]];});
  S.connections.forEach(c=>{if(c.a.kind==='character'&&c.b.kind==='character'&&charById(c.a.id)&&charById(c.b.id))set[pairKey(c.a.id,c.b.id)]=[c.a.id,c.b.id];});
  flatScenes().forEach(s=>{const cs=(s.characters||[]).filter(charById);for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++)set[pairKey(cs[i],cs[j])]=[cs[i],cs[j]];});
  return Object.values(set).map(ids=>({a:ids[0],b:ids[1]}));
}
function relStats(a,b){
  const flat=flatScenes(),shared=flat.filter(s=>(s.characters||[]).includes(a)&&(s.characters||[]).includes(b)),track=bondTrack(a,b);
  let cur=null;track.forEach(p=>{if(p.stage!=null)cur=p.stage;});
  let prev=null;const changes=[];flat.forEach((s,i)=>{const st=track[i].stage;if(st!=null&&st!==prev)changes.push({scene:s,stage:st});prev=st;});
  return {shared,cur,changes,books:[...new Set(shared.map(s=>s.book))],first:shared[0],last:changes[changes.length-1]};
}

  const pairs=allRelPairs();

    return `<div class="row" data-act="openRel" data-a="${p.a}" data-b="${p.b}">
      <div class="rel-av"><span class="av2" style="background:${ca.color}">${esc(initials(ca.name))}</span><span class="av2" style="background:${cb.color}">${esc(initials(cb.name))}</span></div>
      <div><div class="rt">${esc(ca.name)} & ${esc(cb.name)}</div><div class="rs">${st.cur?esc(st.cur):'—'} · ${st.shared.length} shared scene${st.shared.length!==1?'s':''}</div></div>

  return `<div class="view"><div class="eyebrow">Relationships</div>${rows}</div>`;
}

let edovMode='write';
function renderBodyWithMarks(scene){
  const body=scene.body||'';
  const dls=(S.dialogue||[]).filter(x=>x.scene===scene.id);
  let ranges=[];
  dls.forEach(dl=>{const t=dl.text||'';if(!t)return;
    let idx=body.indexOf(t,Math.max(0,(dl.start||0)-30));if(idx<0)idx=body.indexOf(t);
    if(idx>=0){dl.start=idx;dl.end=idx+t.length;ranges.push({start:idx,end:idx+t.length,id:dl.id});}});
  ranges.sort((a,b)=>a.start-b.start);
  let clean=[],lastEnd=-1;ranges.forEach(r=>{if(r.start>=lastEnd){clean.push(r);lastEnd=r.end;}});
  let html='',pos=0;
  clean.forEach(r=>{html+=esc(body.slice(pos,r.start));html+=`<span class="dlg-mark" data-act="openDlg" data-id="${r.id}">${esc(body.slice(r.start,r.end))}</span>`;pos=r.end;});
  html+=esc(body.slice(pos));
  return html.replace(/\n/g,'<br>');
}

function renderPoemWithMarks(poem){
  const body=poem.body||'';const anns=(poem.annotations||[]);let ranges=[];
  anns.forEach(a=>{const t=a.text||'';if(!t)return;let idx=body.indexOf(t,Math.max(0,(a.start||0)-30));if(idx<0)idx=body.indexOf(t);if(idx>=0){a.start=idx;a.end=idx+t.length;ranges.push({start:idx,end:idx+t.length,id:a.id,kind:a.kind});}});
  ranges.sort((a,b)=>a.start-b.start);let clean=[],lastEnd=-1;ranges.forEach(r=>{if(r.start>=lastEnd){clean.push(r);lastEnd=r.end;}});
  let html='',pos=0;clean.forEach(r=>{const col=annColor(r.kind);html+=esc(body.slice(pos,r.start));html+=`<span class="ann-mark" data-act="openAnn" data-id="${r.id}" style="border-bottom-color:${col};background:${col}22">${esc(body.slice(r.start,r.end))}</span>`;pos=r.end;});

function handleInput(e){
  if(e.target.id==='gist'){const s=curScene();if(s){s.gist=e.target.value;}e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';save();return;}
  const el=A(e);if(!el)return;const a=el.dataset.act;
  switch(a){
    case 'focusChar':S.ui.focusChar=el.value||null;S.ui.focusTrait=null;render();break;
    case 'focusTrait':S.ui.focusTrait=el.value;render();break;
    case 'cmpChar':S.ui['cmp'+el.dataset.side]=el.value||null;S.ui['cmp'+el.dataset.side+'t']=null;render();break;
    case 'cmpTrait':S.ui['cmp'+el.dataset.side+'t']=el.value;render();break;
    case 'setTrait':{const s=curScene(),cid=el.dataset.cid,tid=el.dataset.tid;s.arc=s.arc||{};s.arc[cid]=s.arc[cid]||{};s.arc[cid][tid]=+el.value;
      const v=document.getElementById(`val-${cid}-${tid}`);if(v)v.textContent=el.value+'/10';save();break;}
    case 'curVal':{const s=curScene();s.current=s.current||{};s.current[el.dataset.cid]=s.current[el.dataset.cid]||{};s.current[el.dataset.cid][el.dataset.k]=+el.value;
      const o=document.getElementById('cur-'+el.dataset.cid+'-'+el.dataset.k);if(o)o.textContent=el.value+'/10';save();break;}
    case 'traitName':{const t=findTrait(el.dataset.tid);if(t){t.name=el.value;save();}break;}

/* impls */
function saveSlip(){const t=document.getElementById('capInput'),txt=(t.value||'').trim();if(!txt)return;
  S.slips.push({id:uid(),text:txt,t:Date.now(),book:'b1',characters:[]});t.value='';render();setTimeout(()=>document.getElementById('capInput')?.focus(),30);}
function fileSlip(id){const sl=S.slips.find(x=>x.id===id);if(!sl)return;
  const _t=(sl.text||'').trim();const _g=(_t.split(/\n/)[0]||_t).slice(0,60);
  const sc={id:uid(),gist:_g,body:_t,book:sl.book||'b1',milestone:null,characters:(sl.characters||[]).slice(),location:null,arc:{},t:Date.now()};
  S.scenes.push(sc);S.slips=S.slips.filter(x=>x.id!==id);S.ui.editScene=sc.id;go('scene');}
function moveScene(id,dir){const sc=S.scenes.find(x=>x.id===id);if(!sc)return;
  const list=sc.milestone?scenesOfMs(sc.milestone):looseOf(sc.book);const pos=list.indexOf(sc),np=pos+dir;if(np<0||np>=list.length)return;
  const other=list[np];const gi=S.scenes.indexOf(sc);S.scenes.splice(gi,1);S.scenes.splice(S.scenes.indexOf(other)+(dir>0?1:0),0,sc);
  render();requestAnimationFrame(drawRail);}
function moveMs(id,dir){const m=S.milestones.find(x=>x.id===id);const list=milestonesOf(m.book);const pos=list.indexOf(m),np=pos+dir;if(np<0||np>=list.length)return;
  const other=list[np];const gi=S.milestones.indexOf(m);S.milestones.splice(gi,1);S.milestones.splice(S.milestones.indexOf(other)+(dir>0?1:0),0,m);render();}
function togglePresent(cid){const s=curScene();s.characters=s.characters||[];
  if(s.characters.includes(cid)){s.characters=s.characters.filter(x=>x!==cid);if(s.arc)delete s.arc[cid];}else s.characters.push(cid);sceneEditor();}
function newChar(name){const c={id:uid(),name,color:PAL[S.characters.length%PAL.length],attrs:{},traits:[],struggles:[]};S.characters.push(c);return c;}
function addStruggle(){const i=document.getElementById('newStruggle'),t=(i.value||'').trim();if(!t)return;
  const c=charById(S.ui.openCast);c.struggles=c.struggles||[];c.struggles.push({id:uid(),text:t,done:false});charPage();}
function toggleAttr(key,type,val){const sc=S.ui.view==='castOne'?charById(S.ui.openCast):locById(S.ui.openLoc);sc.attrs=sc.attrs||{};
  if(type==='multi'){sc.attrs[key]=sc.attrs[key]||[];const i=sc.attrs[key].indexOf(val);i>=0?sc.attrs[key].splice(i,1):sc.attrs[key].push(val);}
  else sc.attrs[key]=sc.attrs[key]===val?null:val;
  S.ui.view==='castOne'?charPage():locPage();}
function attrAdd(key,type){const kind=S.ui.view==='castOne'?'character':'location';
  askText('Add an option','',val=>{if(!S.palettes[kind][key].includes(val))S.palettes[kind][key].push(val);toggleAttr(key,type,val);},'e.g. violet');}
function exportData(){const b=new Blob([JSON.stringify(LIB,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='the-spine-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);closeSheet();}
function importData(){const i=document.createElement('input');i.type='file';i.accept='application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
    if(isLib(d)){
      if(!confirm('Replace ALL projects here with this backup?'))return;
      LIB=migrateLib(d);const ap=activeProject();S=(ap&&ap.data)||LIB.projects[0].data;
    } else if(looksStory(d)){
      const ap=activeProject();
      if(!confirm(ap?`Replace "${ap.name}" with this backup?`:'Import this story as a new project?'))return;
      S=migrate(d);
      if(ap){ap.data=S;} else {const np={id:uid(),type:'story',name:'Series 1',createdAt:Date.now(),data:S};LIB.projects.push(np);LIB.activeId=np.id;}
      S.ui.view='spine';
    } else { alert("That file doesn't look like a Spine backup."); return; }
    persistLib();closeSheet();render();}
    catch(e){alert("That file couldn't be read.");}};r.readAsText(f);};i.click();}
function fmt(t){const d=new Date(t),n=new Date(),same=d.toDateString()===n.toDateString();
  const tm=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});

/* drag a scene by its grip onto a milestone or book header to relocate it; a tap on the grip opens the move picker */
let drag=null;
function dragClear(){document.querySelectorAll('.drop,.drop-before,.drop-after').forEach(x=>x.classList.remove('drop','drop-before','drop-after'));}
function placeSceneBefore(id,book,ms,beforeId){
  const sc=S.scenes.find(x=>x.id===id);if(!sc)return;
  sc.book=book;sc.milestone=ms||null;
  const gi=S.scenes.indexOf(sc);S.scenes.splice(gi,1);
  if(beforeId&&beforeId!==id){const bi=S.scenes.findIndex(x=>x.id===beforeId);S.scenes.splice(bi<0?S.scenes.length:bi,0,sc);}
  else{let last=-1;S.scenes.forEach((x,i)=>{if(x.book===book&&(x.milestone||null)===(ms||null))last=i;});if(last<0)S.scenes.push(sc);else S.scenes.splice(last+1,0,sc);}
}
function dragUpdateTarget(y){
  if(!drag)return;dragClear();drag.target=null;
  const rows=[...document.querySelectorAll('#spine .scene')];
  for(const el of rows){
    if(el.dataset.id===drag.id)continue;
    const r=el.getBoundingClientRect();
    if(y>=r.top-2&&y<=r.bottom+2){
      const before=y<r.top+r.height/2;
      el.classList.add(before?'drop-before':'drop-after');
      const sc=S.scenes.find(x=>x.id===el.dataset.id);if(!sc)return;
      let beforeId;
      if(before)beforeId=el.dataset.id;
      else{const nx=el.nextElementSibling;beforeId=(nx&&nx.classList.contains('scene'))?nx.dataset.id:null;}
      drag.target={book:sc.book,ms:sc.milestone||null,beforeId};
      return;
    }
  }
  const heads=[...document.querySelectorAll('.ms-head,.book-head')];
  for(const h of heads){const r=h.getBoundingClientRect();
    if(y>=r.top&&y<=r.bottom){h.classList.add('drop');
      if(h.classList.contains('ms-head')){const m=S.milestones.find(x=>x.id===h.dataset.id);if(m)drag.target={book:m.book,ms:m.id,beforeId:null};}
      else if(h.dataset.book){drag.target={book:h.dataset.book,ms:null,beforeId:null};}
      return;
    }
  }
}
function dragAutoScroll(){
  if(!drag){return;}
  if(drag.moved&&drag.autoV){window.scrollBy(0,drag.autoV);dragUpdateTarget(drag.lastY);}
  drag._raf=requestAnimationFrame(dragAutoScroll);
}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]');if(!g||S.ui.view!=='spine')return;
  e.preventDefault();
  drag={id:g.dataset.grip,startY:e.clientY,lastY:e.clientY,moved:false,card:g.closest('.scene'),autoV:0,target:null};
  try{g.setPointerCapture(e.pointerId);}catch(_){}
  drag._raf=requestAnimationFrame(dragAutoScroll);
},{passive:false});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  drag.lastY=e.clientY;
  if(!drag.moved&&Math.abs(e.clientY-drag.startY)>6)drag.moved=true;
  if(!drag.moved)return;
  if(drag.card)drag.card.classList.add('dragging');
  const EDGE=76,vh=window.innerHeight;
  if(e.clientY<EDGE)drag.autoV=-Math.ceil((EDGE-e.clientY)/EDGE*14);
  else if(e.clientY>vh-EDGE)drag.autoV=Math.ceil((e.clientY-(vh-EDGE))/EDGE*14);
  else drag.autoV=0;
  dragUpdateTarget(e.clientY);
});
document.addEventListener('pointerup',()=>{
  if(!drag)return;const d=drag;drag=null;
  if(d._raf)cancelAnimationFrame(d._raf);
  dragClear();
  if(d.card)d.card.classList.remove('dragging');
  if(!d.moved){moveSheet(d.id);return;}
  if(d.target){placeSceneBefore(d.id,d.target.book,d.target.ms,d.target.beforeId);render();requestAnimationFrame(drawRail);}
  else render();
});

  var origCfg=Cloud.cfg.bind(Cloud);
  Cloud.cfg=function(){var c=null;try{c=origCfg();}catch(e){}return c||BAKED;};

  function storyHasContent(st){
    if(!st) return false;
    var keys=['scenes','characters','slips','milestones','objects','orgs','rules','threads','themes','connections'];
    for(var i=0;i<keys.length;i++){var v=st[keys[i]];if(v&&v.length)return true;}
    if(st.bonds&&Object.keys(st.bonds).length)return true;
    return false;
  }
  function libHasContent(lib){
    if(!lib||!lib.projects) return false;
    if(lib.projects.length>1) return true;
    for(var i=0;i<lib.projects.length;i++){var p=lib.projects[i];
      if(p.type!=='story') return true;
      if(storyHasContent(p.data)) return true;}
    return false;
  }
  function libForCloud(){
    return {version:3,_t:LIB._t||Date.now(),projects:(LIB.projects||[]).map(function(p){
      var d=Object.assign({},p.data||{}); delete d.ui;
      return {id:p.id,type:p.type,name:p.name,createdAt:p.createdAt,data:d};
    })};
  }
  function asLib(parsed){
    if(isLib(parsed)) return parsed;
    if(looksStory(parsed)) return {version:3,projects:[{id:uid(),type:'story',name:'Series 1',createdAt:Date.now(),data:parsed}]};
    return null;
  }
  var lastSig=null;
  function contentSig(){
    try{ return JSON.stringify((LIB.projects||[]).map(function(p){
      var d=p.data||{},c={}; for(var k in d){ if(k!=='ui') c[k]=d[k]; }
      return {id:p.id,type:p.type,name:p.name,data:c};
    })); }catch(e){return Math.random()+'';}
  }
  var pushT;
  function scheduleAutoPush(){clearTimeout(pushT);pushT=setTimeout(autoPush,1500);}
  function autoPush(){
    if(!FB.user||!FB.pulled)return;
    var ref;try{ref=firebase.database().ref('spine/'+FB.user.uid);}catch(e){return;}
    ref.child('t').get().then(function(snap){
      var ct=snap.val()||0;
      if(ct>(FB.lastSeenT||0) && ct>(LIB._t||0)){cloudPull(function(){});return;}
      var t=Date.now();
      ref.set({data:JSON.stringify(libForCloud()),t:t}).then(function(){
        FB.lastSeenT=t;FB.lastT=t;if(typeof cloudOpen!=='undefined'&&cloudOpen)cloudSheet();
      }).catch(function(){});
    }).catch(function(){
      var t=Date.now();
      ref.set({data:JSON.stringify(libForCloud()),t:t}).then(function(){FB.lastSeenT=t;FB.lastT=t;}).catch(function(){});
    });
  }
  function adopt(cloudLib,cloudT){
    var keep=LIB.activeId;
    LIB=migrateLib(cloudLib); LIB._t=cloudT;
    if(keep&&LIB.projects.some(function(p){return p.id===keep;})) LIB.activeId=keep; else LIB.activeId=null;
    var ap=activeProject(); S=(ap&&ap.data)||LIB.projects[0].data;
    lastSig=contentSig(); FB.lastSeenT=cloudT; FB.lastT=cloudT; FB.pulled=true;
    persistLib();
    if(typeof cloudOpen!=='undefined'&&cloudOpen){cloudOpen=false;closeSheet();}
    render();
  }
  function cloudPull(cb){
    if(!FB.user){cb&&cb();return;}
    var ref;try{ref=firebase.database().ref('spine/'+FB.user.uid);}catch(e){FB.pulled=true;cb&&cb();return;}
    ref.get().then(function(snap){
      var v=snap.val(),cloudT=(v&&v.t)||0,parsed=null;
      if(v&&v.data){try{parsed=JSON.parse(v.data);}catch(e){}}
      var cloudLib=asLib(parsed);
      if(cloudLib){
        var localHas=libHasContent(LIB), cloudHas=libHasContent(cloudLib), localT=LIB._t||0;
        if(cloudHas && (!localHas || cloudT>localT)){ adopt(cloudLib,cloudT); cb&&cb(); return; }
        FB.lastSeenT=cloudT; FB.pulled=true; lastSig=contentSig();
        if(localHas)autoPush();
        cb&&cb(); return;
      }
      FB.lastSeenT=0; FB.pulled=true; lastSig=contentSig();
      if(libHasContent(LIB))autoPush();
      cb&&cb();
    }).catch(function(){FB.pulled=true;lastSig=contentSig();cb&&cb();});
  }
  var origSave=save;
  save=function(){
    origSave();
    var sig=contentSig();
    if(sig!==lastSig){ lastSig=sig; LIB._t=Date.now(); if(FB.pulled&&FB.user)scheduleAutoPush(); }
  };
  /* Manual backup/restore, made library-aware so they can't clobber other projects */
  cloudBackup=function(){ if(!FB.user)return; cloudSheet('Backing up…');
    var t=Date.now();
    firebase.database().ref('spine/'+FB.user.uid).set({data:JSON.stringify(libForCloud()),t:t})
      .then(function(){FB.lastT=t;FB.lastSeenT=t;cloudSheet('Backed up just now.');})
      .catch(function(err){cloudSheet((err&&err.message)||'Backup failed.',true);}); };
  cloudRestoreDo=function(){ if(!FB.user)return; cloudSheet('Restoring…');
    firebase.database().ref('spine/'+FB.user.uid).get().then(function(snap){var v=snap.val();
      if(!v||!v.data){cloudSheet('No cloud backup found yet — back up first.',true);return;}
      try{ var cl=asLib(JSON.parse(v.data)); if(!cl){cloudSheet('That backup could not be read.',true);return;} adopt(cl,(v.t)||Date.now()); }
      catch(e){cloudSheet('That backup could not be read.',true);}
    }).catch(function(err){cloudSheet((err&&err.message)||'Restore failed.',true);}); };
  function attach(){
    try{
      firebase.auth().onAuthStateChanged(function(u){
        FB.user=u;
        if(u){ if(FB._pulledUid!==u.uid){FB._pulledUid=u.uid; cloudPull(function(){});} }
        else { FB._pulledUid=null; FB.pulled=false; }
      });
    }catch(e){}
  }
  lastSig=contentSig();
  fbInit(Cloud.cfg(), function(){ attach(); }, function(){});
  function refocusPull(){ if(FB.user&&FB.pulled)cloudPull(function(){}); }
  document.addEventListener('visibilitychange',function(){ if(!document.hidden)refocusPull(); });
  window.addEventListener('focus',refocusPull);
})();
